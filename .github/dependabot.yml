version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directories: ["/apps/client", "/apps/server", "/apps/bot"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    versioning-strategy: lockfile-only
    groups:
      dependencies:
        patterns: ["*"]
