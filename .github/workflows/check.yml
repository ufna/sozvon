name: Check, build and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_sfu:
        description: Update the SFU only when no rooms are occupied
        type: boolean
        default: false
concurrency:
  group: sozvon-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm run install:apps
      - run: npm run lint
      - run: npm run test:server
      - run: npm run test:bot
      - run: node --test docker/config.test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
        working-directory: apps/client
      - run: npm run test:smoke
      - name: Scan full history for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact

      - name: Build portable self-hosted image
        run: docker build --build-arg "VERSION=$GITHUB_SHA" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" -t sozvon-selfhost:test .
      - name: Verify packaged SFU/P2P calls and persistent credentials
        run: bash scripts/test-selfhost.sh
      - name: Export tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker save sozvon-selfhost:test | gzip > /tmp/sozvon-selfhost.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: sozvon-selfhost-image
          path: /tmp/sozvon-selfhost.tar.gz
          retention-days: 1
          compression-level: 0

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: check
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      packages: write
    outputs:
      api: ${{ steps.publish.outputs.api }}
      client: ${{ steps.publish.outputs.client }}
      bot: ${{ steps.publish.outputs.bot }}
      sfu: ${{ steps.publish.outputs.sfu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build and publish tested revision
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ vars.SERVER_URL }}
          SERVER_WS_URL: ${{ vars.SERVER_WS_URL }}
          DEPLOY_SFU: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_sfu || false }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SERVER_URL:?Production API URL is required}" "${SERVER_WS_URL:?Production WebSocket URL is required}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          publish() {
            local component=$1 context=$2 dockerfile=$3
            shift 3
            local image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/sozvon-${component}"
            docker build --pull -f "$context/$dockerfile" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              "$@" -t "$image:$GITHUB_SHA" "$context"
            docker push "$image:$GITHUB_SHA"
            local digest
            digest=$(docker inspect "$image:$GITHUB_SHA" --format '{{index .RepoDigests 0}}')
            printf '%s=%s\n' "$component" "$digest" >> "$GITHUB_OUTPUT"
          }
          publish api apps/server Dockerfile
          publish client apps/client Dockerfile \
            --build-arg "SERVER_URL=$SERVER_URL" --build-arg "SERVER_WS_URL=$SERVER_WS_URL" \
            --build-arg DEV_MODE=false --build-arg "VERSION=$GITHUB_SHA"
          publish bot apps/bot Dockerfile
          if [[ "$DEPLOY_SFU" == true ]]; then publish sfu apps/server Dockerfile.livekit; fi
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Deploy immutable images through restricted host entrypoints
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          BOT_SSH_KEY: ${{ secrets.BOT_SSH_KEY }}
          BOT_SSH_KNOWN_HOSTS: ${{ secrets.BOT_SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          BOT_SSH_HOST: ${{ vars.BOT_SSH_HOST }}
          BOT_SSH_USER: ${{ vars.BOT_SSH_USER }}
          API_IMAGE: ${{ needs.build.outputs.api }}
          CLIENT_IMAGE: ${{ needs.build.outputs.client }}
          BOT_IMAGE: ${{ needs.build.outputs.bot }}
          SFU_IMAGE: ${{ needs.build.outputs.sfu }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$keydir/voice"
          printf '%s\n' "$BOT_SSH_KEY" > "$keydir/bot"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$keydir/voice_hosts"
          printf '%s\n' "$BOT_SSH_KNOWN_HOSTS" > "$keydir/bot_hosts"
          voice() { ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$keydir/voice_hosts" -i "$keydir/voice" "$SSH_USER@$SSH_HOST" "$@"; }
          bot() { ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$keydir/bot_hosts" -i "$keydir/bot" "$BOT_SSH_USER@$BOT_SSH_HOST" "$@"; }
          voice "api $API_IMAGE"
          voice "client $CLIENT_IMAGE $GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          bot "bot $BOT_IMAGE"
          if [[ -n "$SFU_IMAGE" ]]; then voice "sfu $SFU_IMAGE"; fi

  selfhost:
    if: github.repository == 'ufna/sozvon' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sozvon-selfhost-image
          path: /tmp/sozvon-selfhost
      - name: Publish the tested image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker load -i /tmp/sozvon-selfhost/sozvon-selfhost.tar.gz
          image="ghcr.io/${GITHUB_REPOSITORY}"
          push_image() {
            for attempt in 1 2 3; do
              if docker push "$1"; then return 0; fi
              sleep 5
            done
            return 1
          }
          for tag in "$GITHUB_SHA" latest; do
            docker tag sozvon-selfhost:test "$image:$tag"
            push_image "$image:$tag"
          done
