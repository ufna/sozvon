map $host $voice_client_entry {
    default index.html;
    govoice.now index-govoice.html;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index $voice_client_entry index.html;

    location = /index.html {
        add_header Cache-Control no-cache;
        try_files /$voice_client_entry /index.html =404;
    }

    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /$voice_client_entry /index.html;
    }

    location / {
        try_files $uri $uri/ /$voice_client_entry /index.html;
    }
}
